<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Manuscript Snake Hunt</title>

<style>
body{
  margin:0;
  background:linear-gradient(135deg,#8B4513,#D2B48C,#DEB887);
  font-family:Arial;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  overflow:hidden;
}

#hud{
  position:absolute;
  top:15px;
  left:50%;
  transform:translateX(-50%);
  font-size:22px;
  font-weight:bold;
  color:#FFD700;
  text-shadow:3px 3px 6px black;
}

#gameContainer{
  display:flex;
  align-items:center;
  gap:25px;
}

canvas{
  background:#F4E4BC;
  border:6px solid #8B7355;
  border-radius:15px;
}

.sidePanel{
  width:220px;
  background:#fff8dc;
  border:4px solid #8B4513;
  border-radius:12px;
  padding:10px;
  max-height:420px;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}

.leftCard, .rightCard{
  width:100%;
  text-align:center;
}

.leftCard img{
  width:80px;
  margin-bottom:5px;
}

.leftCard p{
  font-size:14px;
  color:black;
}

.rightCard img{
  width:140px;
  border:4px solid gold;
  border-radius:10px;
}

.overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.9);
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  gap:20px;
  z-index:10;
  text-align:center;
  color:white;
}

.overlay button{
  padding:15px 30px;
  font-size:18px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}
</style>
</head>
<body>

<div id="hud">Score: 0 / 6</div>

<div id="gameContainer">
  <div id="leftInfo" class="sidePanel"></div>
  <canvas id="game" width="500" height="400"></canvas>
  <div id="rightInfo" class="sidePanel"></div>
</div>

<div id="gameOverScreen" class="overlay">
  <h1 id="endTitle"></h1>
  <button onclick="restartGame()">Play Again</button>
  <button onclick="goHome()">Back to Website</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const grid = 20; // size of each step


let snake = [{x:200, y:200, img:"assets/photos/archeologist.png"}];
let dx = grid;
let dy = 0;
let score = 0;
let count = 0;
let gameOverFlag = false;
const GOAL = 6;

const foods = [ //array
  {img:'assets/photos/Discovery.png', sideImg:'assets/photos/DiscoverySide.jpg', text:"WE LEARN AND EXPLORE NEW SKILLS AND IDEAS  WE EXPLORE MORE INFORMATIONS ABOUT  MANUSCRIPTS AND LEARN HOW TO USE JAVASCRIPT - HTML-CSS- PYTHON-SCRATCH- PID-ARDUINO-3D MODELING-ROBOT DESIGN"},
  {img:'assets/photos/Innovation.png', sideImg:'assets/photos/InnovationSide.jpg', text:"WE USE CREATIVITY TO SOLVE PRBLEMS LIKE PROJECT PROBLEMS WE MAKE RESEARCH PAPER IT CONTAINS THE PROBLEMS AND THEIR SOLUTIONS AND IN THE ROBOT  WE MAKE LINE SQUARING  ."},
  {img:'assets/photos/Impact.png', sideImg:'assets/photos/ImpactSide.png', text:"WE APPLY WHAT WE LEARN TO IMPROVE OUR WORD, WE MAKE SURVEY  WITH PEOPLE  AND JUDGES ."},
  {img:'assets/photos/Inclusion.png', sideImg:'assets/photos/InclusionSide.png', text:"WE RESPECT EACH OTHER AND ACCEPT OUR DIFFERENCES  LIKE THE DIFFERENCES BETWEEN OUR SCHOOLS "},
  {img:'assets/photos/TeamWork.png', sideImg:'assets/photos/TeamSide.jpg', text:"WE ARE STRONG WHEN WE WORK TOGETHER AND MAKE MORE IDEAS AND WORK FASTER ."},
  {img:'assets/photos/Fun.png', sideImg:'assets/photos/FunSide.png', text:"WE ENJOY AND CELEBRATE WHAT  WE DO"}
];

let currentFood = randomFood();
let poison = randomFood();

function randomFood(){
  return {x: Math.floor(Math.random()*25)*grid,
     y: Math.floor(Math.random()*20)*grid};
     //math.random() gives a number between 0 and 1, multiplying it by 25 or 20 gives a number between 0 and 25 or 0 and 20, and then flooring it gives an integer between 0 and 24 or 0 and 19, which we then multiply by grid to get the actual position on the canvas.
     //0.23 * 25 = 5.75 
}

function gameLoop(){
  if(gameOverFlag) return;
  requestAnimationFrame(gameLoop);
  if(++count<12) return;
  count=0;

  ctx.clearRect(0,0,canvas.width,canvas.height);

  
  let headImg = snake[0].img; 
  let head = {x:snake[0].x+dx, y:snake[0].y+dy, img: headImg};
  snake.unshift(head);

  
  if(head.x<0||head.x>=canvas.width||head.y<0||head.y>=canvas.height){
    endGame();
    return;
  }

  
  if(head.x===currentFood.x && head.y===currentFood.y){
    score++;
    updateScore();
    let idx = score-1;

   
    snake[0].img = foods[idx].img;

    
    if(snake.length < score + 1){
      snake.push({x: snake[snake.length-1].x, y: snake[snake.length-1].y, img: foods[idx].img});
    }

    showInfo(idx);
    currentFood=randomFood();
    poison=randomFood();
  } else if(head.x===poison.x && head.y===poison.y){
    alert("⚠️ Poison!");
  } else {
    snake.pop();
  }

  
  snake.forEach((part)=>{
    let img = new Image();
    img.src = part.img;
    ctx.drawImage(img, part.x, part.y, grid, grid);
  });

  
  ctx.fillStyle="gold";
  ctx.fillRect(currentFood.x,currentFood.y,grid-2,grid-2);

  
  ctx.fillStyle="purple";
  ctx.fillRect(poison.x,poison.y,grid-2,grid-2);
}

requestAnimationFrame(gameLoop);

function updateScore(){
  document.getElementById("hud").innerText="Score: "+score+" / 6";
}

function showInfo(idx){
  const item = foods[idx];
  const left = document.getElementById("leftInfo");
  const right = document.getElementById("rightInfo");

  left.innerHTML = `
    <div class="leftCard">
      <img src="${item.img}">
      <p>${item.text}</p>
    </div>
  `;
  
  right.innerHTML = `
    <div class="rightCard">
      <img src="${item.sideImg}">
    </div>
  `;

  if(score === GOAL){
    setTimeout(winGame, 2500); 
  }
}

document.addEventListener("keydown",(e)=>{
  if(e.key==="ArrowUp" && dy===0){dx=0;dy=-grid}
  if(e.key==="ArrowDown" && dy===0){dx=0;dy=grid}
  if(e.key==="ArrowLeft" && dx===0){dx=-grid;dy=0}
  if(e.key==="ArrowRight" && dx===0){dx=grid;dy=0}
});

let startX = 0;
let startY = 0;

// For Mobile Touch Controls

canvas.addEventListener("touchstart", (e) => {
  e.preventDefault(); 
  startX = e.touches[0].clientX;
  startY = e.touches[0].clientY;
}, { passive: false });

canvas.addEventListener("touchend", (e) => {
  e.preventDefault(); 
  let endX = e.changedTouches[0].clientX;
  let endY = e.changedTouches[0].clientY;

  let diffX = endX - startX;
  let diffY = endY - startY;

  if(Math.abs(diffX) > Math.abs(diffY)){
    if(diffX > 0 && dx === 0){
      dx = grid; dy = 0;
    } else if(diffX < 0 && dx === 0){
      dx = -grid; dy = 0;
    }
  } else {
    if(diffY > 0 && dy === 0){
      dx = 0; dy = grid;
    } else if(diffY < 0 && dy === 0){
      dx = 0; dy = -grid;
    }
  }
}, { passive: false });
// End Mobile Touch Controls
function endGame(){
  gameOverFlag=true;
  let screen=document.getElementById("gameOverScreen");
  let title=document.getElementById("endTitle");
  title.innerText="GAME OVER";
  screen.style.display="flex";
}

function winGame(){
  gameOverFlag=true;
  let screen=document.getElementById("gameOverScreen");
  let title=document.getElementById("endTitle");
  title.innerText="You collected all FLL values!";
  screen.style.display="flex";
}

function restartGame(){ location.reload(); }
function goHome(){ window.location.href="index.html"; }

</script>
</body>
</html>
